[workspace]
members = [
    "crates/core",
    "crates/job-store",
    "crates/job-store-factory",
    "crates/job-store-sqlite",
    "crates/reconciler",
    "crates/web",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/lancedb/lance-format-conversion-service"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
lance-conversion-core = { path = "crates/core" }
lance-job-store = { path = "crates/job-store" }
lance-job-store-factory = { path = "crates/job-store-factory" }
lance-job-store-sqlite = { path = "crates/job-store-sqlite" }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
thiserror = { version = "2.0.20", default-features = false }
tokio = { version = "1.53.1", default-features = false }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
uuid = { version = "1.24.0", default-features = false, features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
