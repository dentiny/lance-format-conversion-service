[workspace]
members = [
    "crates/converter",
    "crates/core",
    "crates/job-store",
    "crates/job-store-factory",
    "crates/job-store-sqlite",
    "crates/reconciler",
    "crates/web",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/lancedb/lance-format-conversion-service"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
datafusion = { version = "54.1", default-features = false, features = ["parquet"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
lance = { version = "10.0", default-features = false }
lance-conversion-core = { path = "crates/core" }
lance-converter = { path = "crates/converter" }
lance-job-store = { path = "crates/job-store" }
lance-job-store-factory = { path = "crates/job-store-factory" }
lance-job-store-sqlite = { path = "crates/job-store-sqlite" }
lance-file = { version = "10.0", default-features = false }
lance-table = { version = "10.0", default-features = false }
object_store = { version = "0.13", default-features = false, features = ["aws"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.53", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
