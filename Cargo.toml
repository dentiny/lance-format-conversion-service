[workspace]
members = [
    "crates/converter",
    "crates/core",
    "crates/job-store",
    "crates/job-store-factory",
    "crates/job-store-postgres",
    "crates/job-store-sqlite",
    "crates/reconciler",
    "crates/test-support",
    "crates/web",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/lancedb/lance-format-conversion-service"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[workspace.dependencies]
async-trait = "0.1"
arrow = { version = "58", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
lance = { git = "https://github.com/lance-format/lance", branch = "main", default-features = false }
lance-conversion-core = { path = "crates/core" }
lance-converter = { path = "crates/converter" }
lance-job-store = { path = "crates/job-store" }
lance-job-store-factory = { path = "crates/job-store-factory", default-features = false }
lance-job-store-postgres = { path = "crates/job-store-postgres" }
lance-job-store-sqlite = { path = "crates/job-store-sqlite" }
lance-test-support = { path = "crates/test-support" }
lance-file = { git = "https://github.com/lance-format/lance", branch = "main", default-features = false }
lance-index = { git = "https://github.com/lance-format/lance", branch = "main", default-features = false }
lance-linalg = { git = "https://github.com/lance-format/lance", branch = "main", default-features = false }
object_store = { version = "0.13", default-features = false, features = ["aws", "http"] }
parquet = { version = "58", default-features = false, features = ["arrow", "async", "object_store", "variant_experimental"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio"] }
tempfile = "3.27"
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.53", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
