[package]
name = "lance-converter"
description = "Parquet, Hugging Face, and WARC conversion engine for Lance datasets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
arrow.workspace = true
bytes = "1"
flate2.workspace = true
futures.workspace = true
lance = { workspace = true, features = ["aws"] }
lance-conversion-core.workspace = true
lance-file.workspace = true
lance-index.workspace = true
lance-linalg.workspace = true
object_store.workspace = true
parquet.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "rt", "sync"] }
tokio-util = { workspace = true, features = ["io", "io-util"] }
warc.workspace = true

[dev-dependencies]
axum.workspace = true
lance-test-support.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
