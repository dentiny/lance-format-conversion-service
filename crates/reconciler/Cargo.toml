[package]
name = "lance-reconciler"
description = "Conversion reconciler for Lance format conversion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["postgres"]
postgres = ["lance-job-store-factory/postgres"]
sqlite = ["lance-job-store-factory/sqlite"]

[dependencies]
axum.workspace = true
clap.workspace = true
lance-conversion-core.workspace = true
lance-converter.workspace = true
lance-job-store.workspace = true
lance-job-store-factory.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
pprof = { version = "0.15.0", features = ["flamegraph"] }

[dev-dependencies]
arrow.workspace = true
futures.workspace = true
lance.workspace = true
lance-job-store-postgres = { workspace = true, features = ["test-utils"] }
lance-job-store-sqlite.workspace = true
lance-test-support.workspace = true
serial_test = "3"
tempfile.workspace = true
